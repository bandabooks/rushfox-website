name: Build and publish website

# Builds the Astro site and publishes the static files to the "deploy" branch.
# Hostinger is connected to the "deploy" branch (static site) and auto-deploys on every push.
# The daily schedule makes scheduled Insights posts (future dates) go live automatically.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 05:00 South African time, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Publish site'
